name: CI

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  lint:
    name: 静态检查
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-node@v5
        with:
          node-version: 20
          cache: npm

      - name: 安装 shellcheck
        run: sudo apt-get update -qq && sudo apt-get install -y -qq shellcheck

      - name: 安装依赖
        run: npm ci

      - name: shellcheck
        run: npm run lint

      - name: 提交信息规范（仅 PR）
        if: github.event_name == 'pull_request'
        uses: wagoid/commitlint-github-action@v6

  precheck:
    name: 模块包预检（不发布）
    runs-on: ubuntu-latest
    needs: lint
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # 和正式发版用的是同一个 action / validator；dry-run 只检查，不建 release。
      # 检查项：ZIP 结构、根目录 module.prop 必填字段、versionCode 为 int32、
      # module.yaml schema 与引用文件、module.prop 与 module.yaml 的 id 一致、
      # 资源名匹配 release.assetPattern。
      - uses: KernelSU-Modules/tools/actions/module-release@e0ac1a6193e698beac3c2fc47dec88d180efca8a
        with:
          module-dir: module
          dry-run: true
