name: CI

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  lint:
    name: 检查
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: 安装 shellcheck
        run: sudo apt-get update -qq && sudo apt-get install -y -qq shellcheck

      - name: 安装依赖
        run: npm ci

      - name: shellcheck
        run: npm run lint

      - name: 提交信息规范（仅 PR）
        if: github.event_name == 'pull_request'
        uses: wagoid/commitlint-github-action@v6

  build:
    name: 打包
    runs-on: ubuntu-latest
    needs: lint
    steps:
      - uses: actions/checkout@v4

      - name: 读取版本号
        id: ver
        run: |
          V=$(sed -n 's/^version=//p' module.prop | head -1)
          echo "version=$V" >> "$GITHUB_OUTPUT"

      - name: 构建 zip
        run: ./scripts/build.sh "$GITHUB_WORKSPACE"

      - name: 验证包内脚本可执行位
        run: |
          Z=$(ls gmscore-slim-*.zip | head -1)
          BAD=0
          for f in service.sh action.sh customize.sh boot-completed.sh uninstall.sh; do
            MODE=$(unzip -Z "$Z" "$f" | awk '{print $1}')
            [ "$MODE" = "-rwxr-xr-x" ] || { echo "✗ $f 权限 $MODE"; BAD=1; }
          done
          [ "$BAD" = "0" ] && echo "✓ 脚本权限正确"
          exit "$BAD"

      - uses: actions/upload-artifact@v4
        with:
          name: gmscore-slim-${{ steps.ver.outputs.version }}
          path: gmscore-slim-*.zip
          retention-days: 90

  release:
    name: 发布
    runs-on: ubuntu-latest
    needs: [lint, build]
    if: startsWith(github.ref, 'refs/tags/v')
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: 读取版本号
        id: ver
        run: |
          V=$(sed -n 's/^version=//p' module.prop | head -1)
          echo "version=$V" >> "$GITHUB_OUTPUT"

      - uses: actions/download-artifact@v4
        with:
          name: gmscore-slim-${{ steps.ver.outputs.version }}

      - uses: softprops/action-gh-release@v2
        with:
          files: gmscore-slim-*.zip
          generate_release_notes: true
          body: |
            ## 安装
            在 KernelSU / Magisk 管理器中刷入本 zip。

            默认只开启低风险项，其余功能需编辑
            `/data/adb/gmscore-slim/config.sh` 后重启。

            ## 验证
            重启后查看日志：
            ```
            cat /data/adb/gmscore-slim/log/last.log
            ```
            其中 `sysconfig:` 一行说明 overlay 是否生效
            （`MOUNTED` / `NOT-MOUNTED` / `UNKNOWN`）。
